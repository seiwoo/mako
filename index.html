<title>Makoto AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 1 column, left-aligned header, tabs, then a vertical timeline for the plan */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#16211E; --muted:#5E6B67; --line:#D9E0DD;
  --accent:#D9435C; --accent-ink:#FFFFFF; --sea:#2F6F73; --chip:#E6ECE9;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1715; --surface:#172220; --ink:#E9F0ED; --muted:#9AABA5; --line:#263531;
    --accent:#FF7088; --accent-ink:#1A0A0E; --sea:#5FB3B8; --chip:#223130; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#172220; --ink:#E9F0ED; --muted:#9AABA5; --line:#263531;
  --accent:#FF7088; --accent-ink:#1A0A0E; --sea:#5FB3B8; --chip:#223130; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:24px 56px}
main{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-size:2rem;line-height:1.2;margin:0;letter-spacing:.01em}
h1 span{color:var(--accent)}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-width:0;font:inherit;font-weight:700;padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field label{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
select,input[type=time],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:72px}
.btn{font:inherit;font-weight:700;padding:11px 20px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.plan h2{font-family:var(--f-display);font-size:1.25rem;margin:0;line-height:1.35;text-wrap:balance}
.plan .lead{margin:0;color:var(--muted)}
.day{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;color:var(--sea);margin:6px 0 -6px}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.tl li{display:grid;grid-template-columns:4rem 1fr;gap:12px;padding-bottom:18px;position:relative}
ol.tl li:last-child{padding-bottom:0}
ol.tl li::before{content:"";position:absolute;left:calc(4rem + 5px);top:.6rem;bottom:-.4rem;width:1px;background:var(--line)}
ol.tl li:last-child::before{display:none}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.chk input{margin-top:5px;accent-color:var(--accent)}
.sech{font-family:var(--f-display);font-size:1.1rem;margin:12px 0 0}
.chip.link{text-decoration:none;display:inline-block}
.recs{display:flex;flex-direction:column;gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rec h3{margin:0;font-family:var(--f-display);font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}
.rec .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:4px}
.rec a{font-size:.82rem;color:var(--sea)}
.btn.sm{padding:5px 12px;font-size:.82rem}
.t small{display:block;font-size:.74rem;color:var(--muted)}
.t small.over{color:var(--accent);font-weight:700}
.mv{margin:0 0 4px;font-size:.78rem;color:var(--muted)}
.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--sea);padding-top:1px}
.stop{position:relative;padding-left:16px;min-width:0}
.stop::before{content:"";position:absolute;left:-1px;top:.55rem;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.stop h3{margin:0;font-family:var(--f-display);font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}
.meta{margin:0;color:var(--muted);font-size:.82rem}
.why{margin:4px 0 0;font-size:.9rem}
.stop a{font-size:.82rem;color:var(--sea)}
.badge{display:inline-block;font-size:.72rem;padding:0 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}
.tips{margin:0;padding:12px 14px;background:var(--chip);border-radius:10px;font-size:.88rem}
.cost{margin:0;font-size:.85rem;color:var(--muted)}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:360px;overflow-y:auto}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item input{margin-top:6px;accent-color:var(--accent)}
.item .n{min-width:0}
.item b{font-weight:500;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.count{font-family:var(--f-mono);color:var(--muted)}
.ai{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ai h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
.msg{color:var(--muted);font-size:.9rem;margin:0}
.foot{color:var(--muted);font-size:.78rem;margin:0}
@media (prefers-reduced-motion:no-preference){.plan{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<main>
  <header>
    <h1>Makoto <span>AI</span></h1>
    <p class="sub">2人のお出かけリスト130か所と、真琴さんが好きそうなお店から、時間と距離を見てデートプランを決めます。</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mood" aria-selected="true" aria-controls="p-mood">気分から提案</button>
    <button class="tab" role="tab" id="tab-list" aria-selected="false" aria-controls="p-list">リストから作る</button>
    <button class="tab" role="tab" id="tab-rec" aria-selected="false" aria-controls="p-rec">おすすめ</button>
  </div>

  <section class="panel" id="p-mood" role="tabpanel" aria-labelledby="tab-mood">
    <div class="chips" id="moods" role="group" aria-label="気分"></div>
    <div class="row">
      <div class="field"><label for="area">エリア</label><select id="area"></select></div>
      <div class="field"><label for="budget">デート全体の予算（1人）</label>
        <select id="budget">
          <option value="">気にしない</option><option value="3000">〜3,000円</option><option value="6000">〜6,000円</option>
          <option value="10000">〜10,000円</option><option value="15000">〜15,000円</option><option value="25000">〜25,000円</option>
        </select></div>
      <div class="field"><label for="meals">食事の回数</label><select id="meals"><option value="">おまかせ</option><option value="0">食事なし（カフェ中心）</option><option value="1">1回</option><option value="2">2回</option></select></div>
      <div class="field"><label for="start">開始時間</label><input type="time" id="start" value="11:00"></div>
      <div class="field"><label for="end">終了時間</label><input type="time" id="end" value="18:00"></div>
    </div>
    <label class="chk"><input type="checkbox" id="use-rec" checked> リストにない「おすすめ」のお店も候補に入れる</label>
    <button class="btn" id="go">この条件で提案する</button>
    <div id="out-mood"></div>
    <div class="ai" id="ai" hidden>
      <h2>Makoto AIに相談する</h2>
      <p class="msg">その日の状況を自由に書くと、リストの中からプランを組みます。</p>
      <label for="ai-q" class="msg">相談内容</label>
      <textarea id="ai-q" placeholder="例: 土曜の午後。雨かもしれない。辛いものが食べたくて、夜は静かに飲みたい"></textarea>
      <button class="btn ghost" id="ai-go">AIにプランを作ってもらう</button>
      <div id="out-ai"></div>
    </div>
  </section>

  <section class="panel" id="p-list" role="tabpanel" aria-labelledby="tab-list" hidden>
    <div class="row">
      <div class="field"><label for="q">店名で検索</label><input type="search" id="q" placeholder="例: カフェ、ピザ、温泉"></div>
      <div class="field"><label for="f-area">エリア</label><select id="f-area"></select></div>
    </div>
    <div class="list" id="list"></div>
    <div class="tray">
      <span class="count" id="count">0か所を選択中</span>
      <div class="field" style="flex:0 0 110px"><label for="start2">開始時間</label><input type="time" id="start2" value="12:00"></div>
      <div class="field" style="flex:0 0 110px"><label for="end2">終了時間</label><input type="time" id="end2" value="19:00"></div>
      <button class="btn" id="mk">この順でプランにする</button>
    </div>
    <div id="out-list"></div>
  </section>

  <section class="panel" id="p-rec" role="tabpanel" aria-labelledby="tab-rec" hidden>
    <p class="msg" id="rec-intro"></p>
    <div class="recs" id="recs"></div>
    <h2 class="sech">自分で探す</h2>
    <p class="msg">ジャンルを押すと、Googleマップでそのエリアのお店が検索されます。いつでも最新の結果が出ます。</p>
    <div class="field"><label for="srch-area">エリア</label><select id="srch-area"></select></div>
    <div class="chips" id="genres" role="group" aria-label="ジャンル"></div>
  </section>

  <p class="foot">場所の座標はGoogleマップの検索結果から取得しています（一部は別の店舗と取り違えている可能性があります）。移動時間は直線距離をもとにした目安で、乗り換えや混雑は含みません。</p>
</main>

    const x=pick({k:['cafe','sweets','spot'],max:3},ctx);
    if(!x)break;
    const lastEat=['eat','bar'].includes(ps[ps.length-1].kind);
    const trial=lastEat?[...ps.slice(0,-1),x,ps[ps.length-1]]:[...ps,x];
    const s2=schedule(trial,startT);
    if(s2[s2.length-1].e<=end+10){ps=trial;sch=s2;added++}else{ctx.used.delete(x.id);break}
  }
  const notes=[];
  if(miss)notes.push(HUB[hubKey].label+'には条件に合う場所が足りず、'+miss+'つの枠を省いています。');
  if(dropped)notes.push('終了時間('+endT+')に収まるよう、'+dropped+'か所を減らしました。');
  if(added)notes.push('時間に余裕があったので、'+added+'か所を足しました。');
  const over=sch[sch.length-1].e>end+10;
  if(over)notes.push('終了時間を少し過ぎます。');
  if(ctx.budget&&cost(sch)>ctx.budget)notes.push('予算('+ctx.budget.toLocaleString('ja-JP')+'円)を少し超えます。');
  const tt=travelTotal(sch);
  return{moodKey,hubKey,days:[{label:null,stops:sch}],filled:ps.length,score:base*100+ps.reduce((a,p)=>a+(p.rating||3.8),0)-tt*.05,
    title:m.label+'プラン｜'+HUB[mainHub(ps,hubKey)].label,
    lead:HUB[mainHub(ps,hubKey)].label+'まわりで、'+ps.length+'か所。'+fmt(sch[0].s)+'〜'+fmt(sch[sch.length-1].e)+'、移動は合計約'+tt+'分。'+m.blurb,
    tips:[...notes,...tipsFor(sch)],cost:cost(sch)};
}
function mealSlots(src,meals){
  const slots=src.map(s=>({...s}));
  if(meals===''||meals==null)return slots;
  const n=+meals,isMeal=s=>s.k.includes('eat')||s.k.includes('bar');
  const idx=slots.map((s,i)=>isMeal(s)?i:-1).filter(i=>i>=0);
  idx.slice(0,Math.max(0,idx.length-n)).forEach(i=>{slots[i]={k:['cafe','sweets','spot'],max:3}});
  for(let k=idx.length;k<n;k++)slots.splice(Math.min(1,slots.length),0,{k:['eat'],max:3});
  return slots;
}
function mainHub(ps,dflt){const c={};ps.forEach(p=>c[p.hub]=(c[p.hub]||0)+1);let b=dflt,n=0;for(const k in c)if(c[k]>n){n=c[k];b=k}return b}
function buildTrip(m,moodKey,ctx,startT,end){
  const stays=D.filter(p=>p.kind==='stay'&&D.filter(q=>q.kind!=='stay'&&q.far&&km(p,q)<=15).length>=2);
  if(!stays.length)return{filled:0,score:0};
  const st=stays.map(p=>({p,s:(p.rating||3.8)+ctx.rnd()*1.5+(p.note?.3:0)})).sort((a,b)=>b.s-a.s)[0].p;
  ctx.used.add(st.id);ctx.center=st;
  const d1=[{k:['eat'],max:3},{k:['spot','sweets','activity','cafe']}].map(s=>pick(s,ctx)).filter(Boolean);
  ctx.last=st;
  let d2=[{k:['cafe','sweets']},{k:['eat','spot'],max:3}].map(s=>pick(s,ctx)).filter(Boolean);
  const s1=schedule([...d1,st],startT);
  let s2=schedule(d2,'10:00',st);
  let dropped=0;
  while(s2.length>1&&s2[s2.length-1].e>end+10){d2.pop();dropped++;s2=schedule(d2,'10:00',st)}
  const all=[...s1,...s2];
  const notes=['東京からの移動時間は含んでいません。現地の最寄り駅に着いた時間を開始時間にしてください。'];
  if(dropped)notes.push('2日目は終了時間('+fmt(end)+')に収まるよう'+dropped+'か所を減らしました。');
  notes.push(...tipsFor(all));
  return{moodKey,hubKey:st.hub,days:[{label:'1日目',stops:s1},{label:'2日目',stops:s2}],filled:all.length,score:all.length,
    title:'1泊旅行プラン｜'+HUB[st.hub].label,lead:'宿は「'+st.name+'」。'+HUB[st.hub].label+'まわりで'+all.length+'か所。'+m.blurb,
    tips:notes,cost:cost(all),stay:true};
}
const AUTO=['HT','SB','EB','ME','KG','NB','MN','SN','SG','SJ','YK'];
function suggest(moodKey,hubKey,cap,seed,startT,endT,opt){
  if(hubKey)return build(moodKey,hubKey,cap,seed,startT,endT,opt);
  if(MOODS[moodKey].trip)return build(moodKey,null,cap,seed,startT,endT,opt);
  let best=null,bs=-1e9;
  AUTO.forEach((a,i)=>{const pl=build(moodKey,a,cap,seed+i*17,startT,endT,opt);const s=pl.score+((seed+i)%7)*.3;if(pl.days&&s>bs){bs=s;best=pl}});
  return best;
}
const RANK={cafe:1,spot:2,activity:2,spa:3,sweets:4,eat:5,bar:6,stay:7};
function orderStops(ps){
  if(ps.length<2)return ps.slice();
  const rk=p=>RANK[p.kind]||3;
  const cost=o=>{let c=0;for(let i=1;i<o.length;i++){c+=travel(o[i-1],o[i]).min;if(rk(o[i])<rk(o[i-1]))c+=30}const si=o.findIndex(p=>p.kind==='stay');if(si>=0&&si<o.length-1)c+=1000;return c};
  if(ps.length>7){const s=ps.slice().sort((a,b)=>rk(a)-rk(b));const o=[s.shift()];while(s.length){const l=o[o.length-1];s.sort((a,b)=>travel(l,a).min+rk(a)*3-travel(l,b).min-rk(b)*3);o.push(s.shift())}return o}
  let best=null,bc=1e9;
  (function perm(a,rest){if(!rest.length){const c=cost(a);if(c<bc){bc=c;best=a}return}for(let i=0;i<rest.length;i++)perm([...a,rest[i]],rest.filter((_,j)=>j!==i))})([],ps);
  return best;
}
const $=s=>document.querySelector(s);
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function mapUrl(p){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name)}
function renderPlan(box,plan,endMin){
  box.replaceChildren();
  const card=h('article','plan');
  card.append(h('h2',null,plan.title));
  if(plan.lead)card.append(h('p','lead',plan.lead));
  plan.days.forEach((d,di)=>{
    if(d.label)card.append(h('p','day',d.label));
    const ol=h('ol','tl');
    d.stops.forEach(s=>{
      const p=s.p,li=h('li');
      const t=h('div','t');t.append(h('span',null,s.time));
      if(p.kind==='stay')t.append(h('small',null,'チェックイン'));
      else{const e=h('small',(endMin&&(!plan.days[1]||di===plan.days.length-1)&&s.e>endMin+10)?'over':null,'〜'+s.end);t.append(e)}
      li.append(t);
      const st=h('div','stop');
      if(s.tr&&s.tr.min>0)st.append(h('p','mv','↓ '+s.tr.mode+'約'+s.tr.min+'分（'+s.tr.km.toFixed(1)+'km）'));
      const hh=h('h3',null,p.name);
      if(p.visited)hh.append(h('span','badge','行った'));
      else if(p.check)hh.append(h('span','badge','✅リスト'));
      if(p.rec)hh.append(h('span','badge','おすすめ'));
      st.append(hh);
      const meta=[HUB[p.hub].label,KINDS[p.kind],p.sub,p.kind==='stay'?null:('¥'.repeat(Math.min(p.price,5))),p.rating?'★'+p.rating.toFixed(1):null].filter(Boolean).join(' · ');
      st.append(h('p','meta',meta));
      st.append(h('p','why',s.why||why(p)));
      const a=h('a',null,'地図で開く');a.href=mapUrl(p);a.target='_blank';a.rel='noopener';
      st.append(a);li.append(st);ol.append(li);
    });
    card.append(ol);
  });
  if(plan.tips&&plan.tips.length){const t=h('p','tips');plan.tips.forEach((x,i)=>{if(i)t.append(document.createElement('br'));t.append('・'+x)});card.append(t)}
  if(plan.cost!=null)card.append(h('p','cost','1人あたりの目安：約'+plan.cost.toLocaleString('ja-JP')+'円'+(plan.stay?'（宿泊費は別）':'')));
  box.append(card);
}
function timesOk(a,b,out){
  const s=toMin(a),e=toMin(b);
  if(isNaN(s)||isNaN(e)){out.replaceChildren(h('p','msg','開始時間と終了時間を入力してください。'));return false}
  if(e<=s+60){out.replaceChildren(h('p','msg','終了時間は開始時間より1時間以上あとにしてください。'));return false}
  return true;
}

/* mood tab */
let mood='relax',seed=Number(new Date().toISOString().slice(0,10).replace(/-/g,''));
const moodsEl=$('#moods');
Object.entries(MOODS).forEach(([k,m])=>{
  const b=h('button','chip',m.label);b.type='button';b.setAttribute('aria-pressed',String(k===mood));
  b.onclick=()=>{mood=k;moodsEl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#start').value=m.start;$('#end').value=m.end;run()};
  moodsEl.append(b);
});
const areaSel=$('#area'),fArea=$('#f-area');
areaSel.append(new Option('おまかせ',''));fArea.append(new Option('すべて',''));
HUBS.forEach(hh=>{const n=D.filter(p=>p.hub===hh[0]).length;if(!n)return;if(!hh[4]&&n>=3)areaSel.append(new Option(hh[1]+'（'+n+'か所）',hh[0]));fArea.append(new Option(hh[1]+'（'+n+'）',hh[0]))});
function run(){
  const out=$('#out-mood');
  if(!timesOk($('#start').value,$('#end').value,out))return;
  seed+=1;
  const pl=suggest(mood,areaSel.value,5,seed,$('#start').value,$('#end').value,{meals:$('#meals').value,rec:$('#use-rec').checked,budget:$('#budget').value});
  if(!pl||!pl.days||pl.filled<2){out.replaceChildren(h('p','msg','この条件に合う場所が足りません。エリア・予算・時間を変えてみてください。'));return}
  renderPlan(out,pl,toMin($('#end').value));
}
$('#go').onclick=run;

/* list tab */
const sel=new Set();
function updCount(){$('#count').textContent=sel.size+'か所を選択中'}
function drawList(){
  const q=$('#q').value.trim().toLowerCase(),a=fArea.value;
  const box=$('#list');box.replaceChildren();
  D.filter(p=>(!a||p.hub===a)&&(!q||(p.name+p.sub+KINDS[p.kind]).toLowerCase().includes(q))).forEach(p=>{
    const lab=h('label','item');
    const cb=h('input');cb.type='checkbox';cb.checked=sel.has(p.id);
    cb.onchange=()=>{cb.checked?sel.add(p.id):sel.delete(p.id);updCount()};
    const n=h('div','n');n.append(h('b',null,p.name));if(p.rec)n.querySelector('b').append(h('span','badge','おすすめ'));
    n.append(h('small',null,[HUB[p.hub].label,KINDS[p.kind],p.sub].join(' · ')));
    lab.append(cb,n);box.append(lab);
  });
  if(!box.children.length)box.append(h('p','msg','該当する場所がありません。'));
}
$('#q').oninput=drawList;fArea.onchange=drawList;
$('#mk').onclick=()=>{
  const out=$('#out-list');
  if(!timesOk($('#start2').value,$('#end2').value,out))return;
  const ps=[...sel].map(i=>D[i]);
  if(ps.length<1){out.replaceChildren(h('p','msg','場所を1つ以上選んでください。'));return}
  const sorted=orderStops(ps);
  const stops=schedule(sorted,$('#start2').value);
  const end=toMin($('#end2').value),last=stops[stops.length-1];
  const tt=travelTotal(stops),hubs=[...new Set(sorted.map(p=>HUB[p.hub].label))];
  const tips=[];
  const lateN=stops.filter(s=>s.e>end+10&&s.p.kind!=='stay').length;
  if(last.e>end+10)tips.push('終了時間('+$('#end2').value+')を'+(last.e-end)+'分ほど過ぎます（最後は'+fmt(last.e)+'）。'+(lateN>1?lateN+'か所':'1か所')+'減らすか、終了時間を遅くしてください。');
  else if(end-last.e>=90)tips.push('終了時間まで約'+Math.floor((end-last.e)/30)*30+'分の余裕があります。もう1か所足せそうです。');
  const far=stops.filter(s=>s.tr&&s.tr.km>40);
  if(far.length)tips.push('東京から離れた場所が含まれています。移動は片道'+far.map(s=>s.tr.min).join('・')+'分ほどかかります。');
  tips.push(...tipsFor(stops));
  renderPlan(out,{title:'選んだ'+sorted.length+'か所のプラン',lead:fmt(stops[0].s)+'〜'+fmt(last.e)+'。'+(hubs.length>1?'エリアは'+hubs.join(' ／ ')+'。':hubs[0]+'で回れます。')+'移動は合計約'+tt+'分で、近い順になるよう並べました。',days:[{label:null,stops}],tips,cost:cost(stops),stay:sorted.some(p=>p.kind==='stay')},end);
};

/* tabs */
function showTab(which){
  ['mood','list','rec'].forEach(k=>{$('#tab-'+k).setAttribute('aria-selected',String(k===which));$('#p-'+k).hidden=k!==which});
}
['mood','list','rec'].forEach(k=>{$('#tab-'+k).onclick=()=>showTab(k)});

/* recommendations */
$('#rec-intro').textContent='リストのお店(ピザ・麻婆豆腐や麻辣湯・うどん・海鮮丼・メキシコ料理・ビストロ系の居酒屋・パフェ)の傾向から、リストにないお店を選びました。評価はGoogleマップの値で、好みに合うかは行ってみないと分かりません。気になるものは「選ぶ」でリストから作るタブに入れられます。';
const GENRES=['ピザ','麻婆豆腐・四川料理','麻辣湯','うどん','海鮮丼','メキシコ料理','ビストロ','串焼き','ケバブ','パフェ','パティスリー','カフェ','温泉・スーパー銭湯','焼肉','イタリアン','フレンチ'];
const sa=$('#srch-area');sa.append(new Option('現在地の近く',''));
HUBS.filter(x=>!x[4]).forEach(x=>sa.append(new Option(x[1],x[1].split('・')[0])));
GENRES.forEach(g=>{
  const a=h('a','chip link',g);a.target='_blank';a.rel='noopener';
  const upd=()=>{const ar=sa.value;a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(ar?ar+' '+g:'近くの '+g)};
  upd();sa.addEventListener('change',()=>GENRES.forEach(()=>0)||upd());
  $('#genres').append(a);a._upd=upd;
});
sa.addEventListener('change',()=>$('#genres').querySelectorAll('a').forEach(a=>a._upd()));
const recsEl=$('#recs');
D.filter(p=>p.rec).forEach(p=>{
  const c=h('article','rec');
  c.append(h('h3',null,p.name));
  c.append(h('p','meta',[HUB[p.hub].label,KINDS[p.kind],p.sub,'¥'.repeat(p.price),'★'+p.rating.toFixed(1)].join(' · ')));
  c.append(h('p','why',p.note));
  const act=h('div','acts');
  const b=h('button','btn ghost sm','選ぶ');b.type='button';
  b.onclick=()=>{if(sel.has(p.id)){sel.delete(p.id);b.textContent='選ぶ'}else{sel.add(p.id);b.textContent='選択中 ✓'}updCount();drawList()};
  const a=h('a',null,'地図で開く');a.href=mapUrl(p);a.target='_blank';a.rel='noopener';
  act.append(b,a);c.append(act);recsEl.append(c);
});

/* AI */
const AIMSG={not_granted:'AIの利用が許可されていません。',sampling_disabled:'このアカウントではAIを使えません。',rate_limited:'しばらく待ってからもう一度試してください。',invalid_json:'うまく読み取れませんでした。言い方を変えてもう一度試してください。',refused:'この内容ではプランを作れませんでした。'};
function aiPrompt(q,a,b){
  const lines=D.map(p=>[p.id,p.name,HUB[p.hub].label,p.lat.toFixed(3)+','+p.lng.toFixed(3),KINDS[p.kind],p.sub,'価格'+p.price+'/5',p.rating?'★'+p.rating:'',p.out?'屋外':'屋内',(p.rec?'[リスト外のおすすめ]':'')+p.note.slice(0,40)].join('|')).join('\n');
  return '2人のデートプランを作ってください。下のリストにある場所だけを使い、2〜6か所を選びます。\n条件: 開始'+a+'、終了'+b+'に収まること。座標(緯度,経度)を見て、移動が短くなる近い場所だけを現実的な順番で並べること。旅行や宿泊の相談でなければ、遠方(熱海・箱根・那須・軽井沢・大阪など)と宿は使わないこと。[リスト外のおすすめ]の店は多くて1〜2か所まで。価格は5段階(5が最高)。\n\n【相談内容】\n'+q+'\n\n【場所リスト】id|名前|エリア|座標|種別|ジャンル|価格|評価|屋内外|メモ\n'+lines+'\n\n次のJSONだけを返してください。\n{"title":"プラン名","comment":"一言コメント(80字以内)","stops":[{"id":数値,"reason":"この場所を選んだ理由(60字以内)"}],"tips":["予約などの注意(なければ空配列)"]}\n時間は不要です(こちらで移動時間から計算します)。';
}
let aiBusy=false;
async function aiRun(sample){
  const q=$('#ai-q').value.trim(),out=$('#out-ai');
  if(!q){out.replaceChildren(h('p','msg','相談内容を入力してください。'));return}
  if(!timesOk($('#start').value,$('#end').value,out))return;
  if(aiBusy)return;aiBusy=true;$('#ai-go').disabled=true;
  out.replaceChildren(h('p','msg','Makoto AIが考えています…'));
  try{
    const r=await sample.json(aiPrompt(q,$('#start').value,$('#end').value),{cache:false});
    const seen=new Set(),ps=[],why2=new Map();
    (Array.isArray(r.stops)?r.stops:[]).forEach(s=>{const p=D[Number(s.id)];if(p&&!seen.has(p.id)){seen.add(p.id);ps.push(p);why2.set(p.id,String(s.reason||''))}});
    if(!ps.length)throw{code:'invalid_json'};
    const stops=schedule(ps,$('#start').value);
    stops.forEach(s=>{s.why=why2.get(s.p.id)});
    const end=toMin($('#end').value),last=stops[stops.length-1],tips=(Array.isArray(r.tips)?r.tips:[]).map(String);
    if(last.e>end+10)tips.unshift('移動時間を入れると終了時間('+$('#end').value+')を'+(last.e-end)+'分ほど過ぎます。');
    renderPlan(out,{title:String(r.title||'AIのプラン'),lead:String(r.comment||'')+'（'+fmt(stops[0].s)+'〜'+fmt(last.e)+'、移動は合計約'+travelTotal(stops)+'分）',days:[{label:null,stops}],tips,cost:cost(stops)},end);
  }catch(e){
    out.replaceChildren(h('p','msg',AIMSG[e&&e.code]||'うまくいきませんでした。もう一度試してください。'));
  }finally{aiBusy=false;$('#ai-go').disabled=false}
}
try{
  const u=window.claude&&window.claude.use&&window.claude.use('sample');
  if(u)u.then(s=>{if(s){$('#ai').hidden=false;$('#ai-go').onclick=()=>aiRun(s)}}).catch(()=>{});
}catch(e){}

drawList();
run();
